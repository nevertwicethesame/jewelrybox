.ph{object-fit:cover;display:block}
.phe{display:flex;align-items:center;justify-content:center;background:var(--acc)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.86rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal;overflow-wrap:normal;word-break:normal;min-width:96px;max-width:220px}
th{color:var(--mute);font-weight:normal;font-size:.76rem}
td.stk,th.stk{position:sticky;left:0;z-index:2;background:var(--card);width:120px;min-width:120px;max-width:120px}
tr.grp td{background:var(--bg);font-weight:bold;letter-spacing:.03em;color:var(--acc);font-size:.8rem;white-space:nowrap}
</style>
</head>

<script>
var K='ntts_items_v2', OK='ntts_order_v1', PER=25;

var THEMES={ruby:{n:'Ruby',l:'#7b2d3b',d:'#d98a9b',v1:'#4d2036',v2:'#26101c'},sapphire:{n:'Sapphire',l:'#2e5aa8',d:'#8fb3ff',v1:'#1f2f5a',v2:'#0c1530'},emerald:{n:'Emerald',l:'#1f6b4a',d:'#7fd1a8',v1:'#1d4a37',v2:'#0a2118'}};
var HEARTS={Pink:'🩷',Red:'❤️',Orange:'🧡',Brown:'🤎',Yellow:'💛',Green:'💚','Light blue':'🩵',Blue:'💙',Purple:'💜',Black:'🖤',Gray:'🩶',White:'🤍',Multi:'🌈'};
var SORTS=[['new','Newest first (purchase date)'],['worn','Most worn'],['rest','Least recently worn'],['era','Era'],['status','Status'],['grp:mainColor','Group by Color'],['grp:category','Group by Type'],['grp:period','Group by Period'],['custom','My ordering']];
var CSV_COLS=[['id','id'],['title','title'],['description','description'],['category','category'],['period','period'],['era','era'],['yearMade','year'],['country','country'],['stones','stones'],['metals','metals'],['hallmarks','hallmarks'],['measurements','measurements'],['weight','weight'],['size','size'],['cut','cut'],['mainColor','main color'],['secondaryColor','secondary color'],['tags','motifs'],['notes','notes'],['status','status'],['pdate','purchase date'],['seller','seller'],['platform','platform'],['cost','cost'],['channel','sales channel'],['dListed','date listed'],['link','listing link'],['feeFinal','platform fee'],['shipEst','shipping estimate'],['dSold','date sold'],['ship','shipping'],['final','final payout'],['lastWorn','last worn'],['wornCount','times worn'],['hearts','worn status']];
var FS={
 title:['title','Title','text'],
 description:['description','Description','textarea'],
 category:['category','Category','sel',CATS],
 period:['period','Period','sel',PERIODS],
 era:['era','Era (e.g. 1890s)','text'],

 stones:['stones','Stones (separate with commas)','list'],

 mainColor:['mainColor','Main color','sel',[''].concat(COLOR_ORDER)],
 secondaryColor:['secondaryColor','Secondary color','sel',[''].concat(COLOR_ORDER)],
 tags:['tags','Motifs (separate with commas)','list'],
 notes:['notes','Notes','textarea'],
 status:['status','Status','sel',STAT],
 lastWorn:['lastWorn','Last worn','date'],
 wornCount:['wornCount','Times worn','number'],
 hearts:['hearts','Worn Status','hearts'],
 pdate:['pdate','Purchase date','date'],
 seller:['seller','Seller','text'],
 platform:['platform','Platform','text'],
 cost:['cost','Cost','money'],
 channel:['channel','Sales channel','sel',['','eBay','Instagram']],
 dListed:['dListed','Date listed','date'],
 link:['link','Listing link','url'],
 feeFinal:['feeFinal','Platform fee','money'],
 shipEst:['shipEst','Shipping estimate','money'],
 dSold:['dSold','Date sold','date'],
 ship:['ship','Shipping','money'],
 final:['final','Final payout','money']
};
var LISTS=['stones','metals','tags','cut'];
var PS={eb:13,ig:1.2};
var seed=[
 {id:1,description:'Georgian paste ring. Closed-back setting.',category:'Ring',status:'Listed',period:'Antique',era:'1790s',yearMade:1795,country:'England',stones:['paste'],metals:['silver','gold'],hearts:3,cost:120,listPrice:340,channel:'eBay',pdate:'2026-08-15',dListed:'2026-09-01'},
 {id:2,description:'Snake bracelet with garnet eyes.',category:'Bracelet',status:'Sold',period:'Antique',era:'1870s',yearMade:1870,country:'France',stones:['garnet'],metals:['gold'],tags:['snake'],mainColor:'Red',hearts:4,cost:210,final:480,feeFinal:40,ship:12,channel:'Instagram',pdate:'2026-06-10',dListed:'2026-07-02',dSold:'2026-07-20'},
 {id:3,description:'Roman intaglio ring, carnelian.',category:'Ring',status:'Private Collection',period:'Antique',era:'Roman',country:'Italy',stones:['carnelian'],metals:['gold'],mainColor:'Orange',hearts:5,cost:650,pdate:'2026-03-02'},
 {id:4,description:'Emerald-cut drop earrings.',category:'Earring',status:'Private Collection',period:'Antique',era:'1905',yearMade:1905,country:'USA',stones:['emerald','diamond'],metals:['platinum'],mainColor:'Green',hearts:5,cost:380,pdate:'2026-05-20'}
];

/* ---------- state ---------- */
var items=[],order=[],theme='ruby',hideSold=true,view='box',page=1,editing=null,fsel={},rng={},sortBy='new',cols=4,ctab='Item',vmode='thumbs',q='',ro=false,dragEl=null,overEl=null,ioOpen=false,lastJ=null,CR=null,DB=null,MEM={},shipTouched=false;

/* ---------- storage (IndexedDB) ---------- */
function openDB(){return new Promise(function(res,rej){if(!window.indexedDB)return rej('no indexedDB');var r=indexedDB.open('ntts',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function kget(k){return new Promise(function(res){if(!DB)return res(MEM[k]);var t=DB.transaction('kv').objectStore('kv').get(k);t.onsuccess=function(){res(t.result)};t.onerror=function(){res(undefined)}})}
function kset(k,v){return new Promise(function(res){if(!DB){MEM[k]=JSON.parse(JSON.stringify(v));return res()}var t=DB.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=function(){res()};t.onerror=function(){alert('Could not save to this device. Storage may be full.');res()}})}
function kclear(){return new Promise(function(res){if(!DB){MEM={};return res()}var t=DB.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=function(){res()};t.onerror=function(){res()}})}
function saveItems(){return kset('items',items)}
function saveOrder(){return kset('order',order)}
function saveSettings(){kset('theme',theme);return kset('hideSold',hideSold)}
async function init(){
 try{DB=await openDB()}catch(e){DB=null}
 var it=await kget('items');
 if(it===undefined){
   var legacy=null,lo=null;
   try{legacy=JSON.parse(localStorage.getItem(K)||localStorage.getItem('ntts_items_v1')||'null')}catch(e){}
   try{lo=JSON.parse(localStorage.getItem(OK)||'null')}catch(e){}
   items=(legacy||JSON.parse(JSON.stringify(seed))).map(mig);
   order=lo||[];
   await kset('items',items);await kset('order',order);await kset('theme',theme);await kset('hideSold',hideSold);
 }else{
   items=it.map(mig);
   order=(await kget('order'))||[];
   theme=(await kget('theme'))||'ruby';
   var hs=await kget('hideSold');hideSold=typeof hs==='boolean'?hs:true;
 }
 if(!THEMES[theme])theme='ruby';
}

/* ---------- formatting & helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cap(s){s=String(s||'');return s.charAt(0).toUpperCase()+s.slice(1)}
function capColor(s){s=String(s||'').trim().toLowerCase();var k=COLOR_ORDER.filter(function(c){return c.toLowerCase()===s})[0];return k||''}
function fmtMoney(n){if(n==null||n==='')return '';var v=Number(n);if(isNaN(v))return '';return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function parseMoney(s){s=String(s==null?'':s).replace(/[^0-9.\-]/g,'');if(s===''||s==='-'||s==='.')return '';var n=Number(s);return isNaN(n)?'':n}
function money(n){return n==null||n===''||isNaN(Number(n))?'—':fmtMoney(n)}
function fmtDate(iso){var m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[2]+'/'+m[3]+'/'+m[1]:''}
function parseDate(s){s=String(s||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!m)return '';return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function num(v){return v===''||v==null?null:Number(v)}
function title(i){return i.title||(i.description||'Untitled').split('.')[0].slice(0,60)}
function days(i){return i.dListed&&i.dSold?Math.round((new Date(i.dSold)-new Date(i.dListed))/864e5):null}
function profit(i){return num(i.final)!=null&&num(i.cost)!=null?num(i.final)-num(i.cost):null}
function fees(i){return Number(i.feeFinal)||0}
function net(i){return profit(i)==null?null:profit(i)-fees(i)-(Number(i.ship)||0)}
function sw(n){var c=COLORS[String(n).toLowerCase()];return c?'<span class="sw" style="background:'+c+'"></span>':''}
function hearts(n){return n?'❤️'.repeat(n):''}
function distinct(arr){var s={};arr.forEach(function(v){if(v!==''&&v!=null)s[String(v)]=1});return Object.keys(s).sort()}
function allOf(fn){return distinct(items.reduce(function(a,i){return a.concat(fn(i)||[])},[]))}
function finger(i){
 if(i.category!=='Ring')return null;
 var s=parseFloat(String(i.size||'').replace(/[^0-9.]/g,''));
 if(isNaN(s)||!s)return null;
 return s>=8?'Index finger':s>=7?'Middle finger':s>=6?'Ring finger':'Pinky';
}
function shipDefault(cost){var c=Number(cost);return (cost===''||cost==null||isNaN(c)||c<500)?7:20}
function mig(i){
 if(STAT.indexOf(i.status)<0)i.status='Private Collection';
 var PM={Ancient:'Ancient',Georgian:'Antique',Victorian:'Antique',Edwardian:'Antique','Art Deco':'Vintage',Retro:'Vintage',Other:'Vintage','Mid-century':'Mid-Century','Mid-Century':'Mid-Century',Modern:'New',New:'New',Vintage:'Vintage',Antique:'Antique'};
 i.period=PM[i.period]||'Antique';
 if(typeof i.cut==='string')i.cut=i.cut.split(/[;,]/).map(function(s){return s.trim()}).filter(Boolean);
 if(!Array.isArray(i.cut))i.cut=[];
 if(!Array.isArray(i.refs))i.refs=[];
 var ex=(Number(i.fees)||0)+(Number(i.promo)||0)+(Number(i.feePay)||0);
 if(ex)i.feeFinal=(Number(i.feeFinal)||0)+ex;
 delete i.fees;delete i.promo;delete i.feePay;delete i.comps;delete i.pshots;delete i.simg;
 var t=[];
 (i.tags||[]).forEach(function(x){
   x=String(x);
   var m=x.match(/^colou?r:(.+)$/i);
   if(m){if(!i.mainColor)i.mainColor=capColor(m[1]);return}
   if(/^mood:/i.test(x))return;
   t.push(x.replace(/^motifs?:/i,''));
 });
 i.tags=t;
 i.mainColor=capColor(i.mainColor);i.secondaryColor=capColor(i.secondaryColor);
 i.category=CATS.filter(function(c){return c.toLowerCase()===String(i.category||'').toLowerCase()})[0]||'Other';
 i.hearts=Math.min(5,Math.max(0,Number(i.hearts)||0));
 if(i.notes==null)i.notes='';

/* ---------- CSV / JSON import & export ---------- */
function download(name,mime,text){var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1000)}
function readFile(f,cb){var r=new FileReader();r.onload=function(){cb(String(r.result))};r.readAsText(f)}
function csvCell(v){v=v==null?'':Array.isArray(v)?v.join('; '):String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
 var head=CSV_COLS.map(function(c){return c[0]}).join(',');
 var body=items.map(function(i){return CSV_COLS.map(function(c){return csvCell(i[c[0]])}).join(',')});
 download('ntts-records-'+today()+'.csv','text/csv',[head].concat(body).join('\r\n'));
}
function parseCSV(t){
 var rows=[],row=[],f='',q2=false;
 for(var i=0;i<t.length;i++){
   var c=t[i];
   if(q2){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q2=false}else f+=c}
   else if(c==='"')q2=true;
   else if(c===','){row.push(f);f=''}
   else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
   else f+=c;
 }
 if(f.length||row.length){row.push(f);rows.push(row)}
 return rows.filter(function(r){return r.some(function(x){return x.trim()!==''})});
}
function coerce(k,v){
 if(LISTS.indexOf(k)>-1)return v.split(/[;,]/).map(function(s){return s.trim()}).filter(Boolean);
 if(['yearMade','wornCount','cost','feeFinal','shipEst','ship','final'].indexOf(k)>-1){var n=Number(String(v).replace(/[$,]/g,''));return isNaN(n)?'':n}
 if(k==='hearts'){var h=Number(v);return isNaN(h)?0:Math.min(5,Math.max(0,Math.floor(h)))}
 if(['lastWorn','pdate','dListed','dSold'].indexOf(k)>-1)return parseDate(v)||String(v);
 if(k==='category')return CATS.filter(function(c){return c.toLowerCase()===v.toLowerCase()})[0]||'Other';
 if(k==='status')return STAT.filter(function(s){return s.toLowerCase()===v.toLowerCase()||(v.toUpperCase()==='PC'&&s==='Private Collection')})[0]||'Private Collection';
 if(k==='period')return PERIODS.filter(function(p){return p.toLowerCase()===v.toLowerCase()})[0]||'Antique';
 if(k==='mainColor'||k==='secondaryColor')return capColor(v);
 return v;
}
function importCSV(text){
 var rows=parseCSV(text);
 if(rows.length<2){alert('No records found in that file.');return}
 var head=rows[0].map(function(h){return h.trim()}),idx={};
 CSV_COLS.forEach(function(c){
   var j=-1;
   head.forEach(function(h,n){if(j<0&&(h===c[0]||h.toLowerCase()===c[1]||h.toLowerCase()===c[0].toLowerCase()))j=n});
   idx[c[0]]=j;
 });
 var added=0,updated=0,skipped=0,nid=Date.now();
 rows.slice(1).forEach(function(r){
   var rec={};
   CSV_COLS.forEach(function(c){var j=idx[c[0]];if(j<0)return;var v=(r[j]||'').trim();if(v!=='')rec[c[0]]=v});
   if(!rec.title&&!rec.description){skipped++;return}
   var existing=rec.id?items.filter(function(i){return String(i.id)===rec.id})[0]:null;
   var out=existing?JSON.parse(JSON.stringify(existing)):{id:nid++,status:'Waiting',category:'Other',period:'Antique',tags:[],stones:[],metals:[],cut:[],hearts:0,refs:[]};
   Object.keys(rec).forEach(function(k){if(k!=='id')out[k]=coerce(k,rec[k])});
   out=mig(out);
   if(existing){items[items.indexOf(existing)]=out;updated++}else{items.push(out);added++}
 });
 saveItems();render();
 alert('Added '+added+', updated '+updated+(skipped?', skipped '+skipped+' (no title or description)':'')+'.');
}
function exportJSON(){
 download('ntts-backup-'+today()+'.json','application/json',JSON.stringify({app:'never-twice-the-same',version:4,exported:new Date().toISOString(),items:items,order:order,theme:theme,hideSold:hideSold}));

 if(!confirm('Replace everything on this device with this backup ('+arr.length+' pieces)?'))return;
 items=arr.map(mig);

 if(d.theme&&THEMES[d.theme])theme=d.theme;
 if(typeof d.hideSold==='boolean')hideSold=d.hideSold;

document.addEventListener('submit',function(e){
 e.preventDefault();
 var o=mig(syncForm()),idx=items.findIndex(function(i){return i.id===o.id});

 idx>-1?items[idx]=o:items.push(o);
 saveItems();show('box');
});
document.addEventListener('pointerdown',function(e){
 var v=e.target.closest('#cropv');
 if(v&&CR){CR.p[e.pointerId]={x:e.clientX,y:e.clientY};v.setPointerCapture(e.pointerId);return}
 if(!ro)return;var t=e.target.closest('.ro .tile');if(!t)return;dragEl=t;t.classList.add('drag');
});
document.addEventListener('pointermove',function(e){
 if(CR&&CR.p[e.pointerId]){
   var ids=Object.keys(CR.p),o=CR.p[e.pointerId];
   if(ids.length>1){var other=CR.p[ids.filter(function(k){return k!=e.pointerId})[0]],d0=Math.hypot(o.x-other.x,o.y-other.y),d1=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(d0)cropZoom(Math.min(4,Math.max(1,CR.z*d1/d0)))}
   else{CR.x+=e.clientX-o.x;CR.y+=e.clientY-o.y;cropPlace()}
   CR.p[e.pointerId]={x:e.clientX,y:e.clientY};
   return;
 }
 if(!dragEl)return;
 var t=document.elementsFromPoint(e.clientX,e.clientY).filter(function(n){return n.classList&&n.classList.contains('tile')&&n!==dragEl})[0];
 if(overEl&&overEl!==t)overEl.classList.remove('over');
 overEl=t||null;if(overEl)overEl.classList.add('over');
});
function endDrag(e){
 if(CR&&CR.p)delete CR.p[e.pointerId];
 if(!dragEl)return;
 var from=Number(dragEl.dataset.id),to=overEl?Number(overEl.dataset.id):null;
 dragEl=null;overEl=null;
 if(to!=null){
   if(order.indexOf(from)<0)order=sorted(items).map(function(i){return i.id});
   var fi=order.indexOf(from),ti=order.indexOf(to),o=order.filter(function(x){return x!==from});
   o.splice(o.indexOf(to)<0?o.length:(fi<ti?o.indexOf(to)+1:o.indexOf(to)),0,from);
   order=o;saveOrder();
 }
 render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
