.curtain .cl{left:0;transform-origin:left center}
.curtain .cr{right:0;transform-origin:right center;transition-delay:.05s}
.curtain .cl::after{right:6px}
.curtain .cr::after{left:6px}
.curtain.open .cl{transform:rotateY(-78deg);opacity:0}

.modal.kwm .kwopen{color:var(--gold);border-color:var(--gold)}

.savest.on{display:inline-flex}

/* ---------- images: one stored copy, crops stored as fractions ---------- */
function readRaw(file){
 return new Promise(function(res,rej){
   var r=new FileReader();
   r.onerror=rej;
   r.onload=function(){
     var img=new Image();
     img.onerror=function(){alert('Could not read that image.');rej(new Error('read'))};
     img.onload=function(){
       var scales=[0.5,0.4,0.33,0.25],quals=[0.85,0.7,0.55],last=0,types=[['image/webp'],['image/jpeg']];
       var c=document.createElement('canvas');
       for(var s=0;s<scales.length;s++){
         var w=Math.max(1,Math.round(img.width*scales[s])),h=Math.max(1,Math.round(img.height*scales[s]));
         c.width=w;c.height=h;
         var ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
         for(var t=0;t<types.length;t++){
           for(var q=0;q<quals.length;q++){
             var url=c.toDataURL(types[t][0],quals[q]);
             if(url.indexOf('data:'+types[t][0])!==0)break;
             var bytes=Math.floor(url.split(',')[1].length*3/4);last=bytes;
             if(bytes<=MAX_UPLOAD)return res(url);
           }
         }
       }
       alert('That image is still '+Math.round(last/1024)+' KB after compressing. The limit is 300 KB. Please use a smaller or simpler image.');
       rej(new Error('too large'));
     };
     img.src=r.result;
   };
   r.readAsDataURL(file);
 });
}

function pieceInColl(i){return colls.some(function(c){return (c.pieceIds||[]).indexOf(i.id)>-1})}

function cntColor(c){var F=facetOf('colorMain');return vis().filter(function(i){return F.g(i).indexOf(c)>-1}).length}
function cntF(F,v){var lv=String(v).toLowerCase();return vis().filter(function(i){return F.g(i).map(function(x){return String(x==null?'':x).toLowerCase()}).indexOf(lv)>-1}).length}
function facetVals(F){var v=F.v();if(F.counted)v=v.map(function(x){return {x:x,c:cntF(F,x)}}).sort(function(a,b){return b.c-a.c||String(a.x).localeCompare(String(b.x))}).map(function(o){return o.x});if(F.k==='colorMain')v=v.slice().sort(function(a,b){var ra=COLOR_ORDER.indexOf(a),rb=COLOR_ORDER.indexOf(b);return (ra<0?99:ra)-(rb<0?99:rb)});return v}
function matchQ(i){
 if(!q)return true;
 var h=[title(i),i.notes,i.category,i.status,i.period,i.era,i.country,(i.stone||[]).join(' '),(i.metal||[]).join(' '),(i.motif||[]).join(' '),(i.cut||[]).join(' '),i.colorMain,i.hallmark,i.seller,i.purchasePlatform,i.sellPlatform,i.provenance,i.condition].join(' ').toLowerCase();
 return q.split(/\s+/).every(function(w){return h.indexOf(w)>-1});
}
function purchYear(i){var y=(i.purchaseDate||'').slice(0,4);return /^\d{4}$/.test(y)?Number(y):null}
function inR(k,v){var r=rng[k];if(!r)return true;return v!=null&&v!==''&&Number(v)>=r[0]&&Number(v)<=r[1]}
function isHidden(i){return secretCfg.threshold!=null&&num(i.cost)!=null&&num(i.cost)>secretCfg.threshold}
function pass(i){
 if(secretCfg.on&&isHidden(i))return false;
 if(!matchQ(i))return false;
 var pickedStatus=fsel.status&&fsel.status.length;
 for(var n=0;n<FACETS.length;n++){
   var F=FACETS[n],s=fsel[F.k];
   if(!s||!s.length)continue;
   var vals=F.g(i).map(function(v){return v==null?'':String(v).toLowerCase()});
   if(!s.some(function(x){return vals.indexOf(String(x).toLowerCase())>-1}))return false;
 }
 return inR('year',purchYear(i))&&inR('cost',i.cost);
}
function gKey(i,p){

 return v==null||v===''?'~':String(v).toLowerCase();
}
function sorted(list){
 var a=list.slice();
 if(sortBy==='new')a.sort(function(x,y){var dx=x.purchaseDate||'',dy=y.purchaseDate||'';if(dx!==dy)return dx<dy?1:-1;return y.id-x.id});
else if(sortBy==='old')a.sort(function(x,y){var dx=x.purchaseDate||'',dy=y.purchaseDate||'';if(dx!==dy){if(!dx)return 1;if(!dy)return -1;return dx<dy?-1:1}return x.id-y.id});
 else if(sortBy==='worn')a.sort(function(x,y){return (Number(y.wornCount)||0)-(Number(x.wornCount)||0)});
 else if(sortBy==='rest')a.sort(function(x,y){return (x.wornLast||'').localeCompare(y.wornLast||'')});
 else if(sortBy==='custom')a.sort(function(x,y){return (order.indexOf(x.id)-order.indexOf(y.id))||(y.id-x.id)});
 else if(sortBy==='era'||sortBy==='status')a.sort(function(x,y){return String(x[sortBy]||'~').localeCompare(String(y[sortBy]||'~'))});
 else if(sortBy.indexOf('grp:')===0){var p=sortBy.slice(4);a.sort(function(x,y){var kx=gKey(x,p),ky=gKey(y,p);return kx<ky?-1:kx>ky?1:y.id-x.id})}
 return a;

rMain\": array of strings. Choose only from: Red, Pink, Orange, Brown, Yellow, Green, Light blue, Blue, Purple, Black, Gray, White, Multi. Ignore emoji and numbers.\n- \"motif\": array of strings\n- \"notes\": text. Include only for a special circumstance, such as a defect, repair, missing part, or a discrepancy between the listing and the item. Seller policies (shipping, returns, payment) are not notes. Omit otherwise.\n- \"purchaseDate\": YYYY-MM-DD. Omit if the listing has no purchase date.\n- \"seller\": text\n- \"purchasePlatform\": \"Etsy\", \"1stDibs\", or \"Seller\". Any other platform is \"Seller\".\n- \"cost\": number with no currency symbol or code\n\nSource priority: the listing text is primary. Use the photos to confirm or fill in color, stone, and cut only when the text is silent. If text and photos conflict, use the text, and record the conflict in \"notes\" only if it is a special circumstance.\n\nRing size chart (US & Canada column):\n5.25 = J.5 (UK); 5.5 = K; 5.75 = K.5; 6 = L; 6.25 = L.5; 6.5 = M; 6.75 = M.5; 7 = N; 7.25 = N.5; 7.5 = O; 7.75 = O.5; 8 = P; 8.25 = P.5; 8.5 = Q; 8.75 = Q.5; 9 = R; 9.25 = R.5\n\nExample: for a ring listed as \"M (UK)\" with \"18k rose gold\" in the text, output:\n{\"title\": \"Rose Cut Diamond Cluster Ring\", \"category\": \"Ring\", \"period\": \"Antique\", \"decade\": \"1880s\", \"metal\": [\"18k rg\"], \"ringSize\": 6.5, \"colorMain\": [\"Yellow\"], \"purchasePlatform\": \"Seller\"}";

 if(LISTS.indexOf(k)>-1){var parts=t.value.split(',');parts[parts.length-1]=' '+v;t.value=parts.map(function(x){return x.trim()}).filter(Boolean).join(', ')+', '}else t.value=v;
