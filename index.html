 var rows=list.slice((page-1)*PER,page*PER);
 return ''
  
  +'<div class="tw"><table><thead><tr><th class="stk">Piece</th>'+cols.map(function(c){return '<th>'+c[0]+'</th>'}).join('')+'<th></th></tr></thead><tbody>'
  +rows.map(function(i){return '<tr><td class="stk"><div style="display:flex;gap:8px;align-items:center">'+(i.cover?'<img class="ph" src="'+esc(i.cover)+'" alt="">':'<span class="phe">'+(EMOJI[i.category]||'💎')+'</span>')+'<span>'+esc(title(i))+'</span></div></td>'+cols.map(function(c){return '<td>'+c[1](i)+'</td>'}).join('')+'<td><button data-edit="'+i.id+'">Edit</button></td></tr>'}).join('')
  +'</tbody></table></div>'+(rows.length?'':'<p class="meta">No pieces match these filters.</p>')+countLine(list.length)
  +'<div class="pager"><button data-pg="-1"'+(page<=1?' disabled':'')+'>Prev</button><span>Page '+page+' of '+n+'</span><button data-pg="1"'+(page>=n?' disabled':'')+'>Next</button></div>';
}
function renderBox(){
 if(vmode==='table')return renderTable();
 var list=ro?sorted(items):sorted(items.filter(pass));
 return (ro?'<div class="bar"><span class="meta">Drag a photo onto another to move it. Order saves automatically.</span><button class="pri" data-ro="1">Done</button></div>':'')
  +'<div class="box"><div class="grid'+(ro?' ro':'')+'" style="grid-template-columns:repeat('+cols+',1fr)">'+list.map(thumb).join('')+'</div></div>'+(list.length?'':'<p class="meta">No pieces match.</p>')+countLine(list.length);
}
function renderBoxOld(){
 if(vmode==='table')return renderTable();
 var list=ro?sorted(items):sorted(items.filter(pass));
 return '<div class="bar"><button data-drawer="1">☰ Filters'+(sel.length?' ('+sel.length+')':'')+'</button>'+vtoggle()+'<span class="seg">'+[1,2,3,4].map(function(n){return '<button data-cols="'+n+'"'+(n===cols?' class="on"':'')+'>'+n+'</button>'}).join('')+'</span><span class="meta">across</span><button data-ro="1"'+(ro?' class="on"':'')+'>'+(ro?'Done':'✥ Reorder')+'</button><button data-jotd="1">✨ JOTD</button></div>'+(ro?'<p class="meta">Drag a photo onto another to move it. Your order saves automatically.</p>':'')
  +'<div class="box"><div class="grid'+(ro?' ro':'')+'" style="grid-template-columns:repeat('+cols+',1fr)">'+list.map(thumb).join('')+'</div></div>'+(list.length?'':'<p class="meta">No pieces match these filters.</p>');
}
function row(l,v){return '<div class="meta"><b>'+l+':</b> '+esc(v==null||v===''?'—':v)+'</div>'}
function cardFor(i){
 var b;
 if(ctab==='Item')b=row('Category',i.category)+row('Era',i.era)+row('Country',i.country)+row('Stones',(i.stones||[]).join(', '))+row('Metals',(i.metals||[]).join(', '))+row('Times worn',i.wornCount)+'<span class="badge">'+esc(i.status)+'</span>';
 else if(ctab==='Purchase')b=row('Date',i.pdate)+row('Seller',i.seller)+row('Platform',i.platform)+row('Cost',money(num(i.cost)));
 else b=row('Channel',i.channel)+row('Listing price',money(num(i.listPrice)))+row('Final price',money(num(i.final)))+row('Turnover',days(i)==null?'—':days(i)+' days')+row('Profit',money(profit(i)))+row('Net profit',money(net(i)));
 return '<div class="card">'+thumb(i)+'<strong>'+esc(title(i))+'</strong>'+b+'<button data-edit="'+i.id+'">Edit</button></div>';
}
function renderCat(){
 var n=Math.max(1,Math.ceil(items.length/PER)); if(page>n)page=n;
 var rows=sorted(items).slice((page-1)*PER,page*PER);
 return '<div class="bar">'+['Item','Purchase','Sale'].map(function(t){return '<button data-ct="'+t+'"'+(t===ctab?' class="on"':'')+'>'+t+'</button>'}).join('')+'<span class="meta">'+items.length+' pieces</span></div><div class="grid">'+rows.map(cardFor).join('')
  +'</div><div class="pager"><button data-pg="-1"'+(page<=1?' disabled':'')+'>Prev</button><span>Page '+page+' of '+n+'</span><button data-pg="1"'+(page>=n?' disabled':'')+'>Next</button></div>';
}
function field(f,v){
 var k=f[0],t=f[2],val=LISTS.indexOf(k)>-1?(v||[]).join(', '):(v==null?'':v), c;
 if(t==='cover')return '<div style="grid-column:1/-1"><span class="meta">Cover photo</span><img id="cvimg" class="cvimg" alt=""'+(val?' src="'+esc(val)+'"':' hidden')+'><input type="file" id="cvfile" accept="image/*"><input type="hidden" name="cover" id="cvval" value="'+esc(val)+'"><input type="hidden" id="cvurl"><p class="seg"><button type="button" data-cvadj="1">Zoom / pan</button><button type="button" data-cvrm="1">Remove photo</button></p><div id="crop" hidden><div id="cropv"><img id="cropimg" alt="" draggable="false"></div><input type="range" id="cropz" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><p class="seg"><button type="button" class="pri" data-cvok="1">Use this crop</button><button type="button" data-cvcancel="1">Cancel</button></p><p class="meta">Drag to pan. Use the slider (or pinch) to zoom. The square is your thumbnail.</p></div></div>';
 if(t==='textarea')c='<textarea name="'+k+'" rows="3">'+esc(val)+'</textarea>';
 else if(t==='sel')c='<select name="'+k+'">'+f[3].map(function(o){return '<option'+(o===val?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
 else c='<input name="'+k+'" type="'+t+'"'+(k==='wornCount'?' min="0" step="1" inputmode="numeric"':t==='number'?' step="0.01" inputmode="decimal"':'')+' value="'+esc(val)+'">';
 return '<label>'+f[1]+c+'</label>';
}
function renderEdit(){
 var it=editing;
 return '<h2>'+(it._new?'Add a piece':'Edit piece')+'</h2><form id="form">'+SCHEMA.map(function(sec){
  var extra=sec.s==='Sale'?'<label>Turnover (days listed → sold)<div class="calc" id="c-days">'+(days(it)==null?'—':days(it)+' days')+'</div></label><label>Net profit (after fees &amp; shipping)<div class="calc" id="c-net">'+money(net(it))+'</div></label><label>Total fees<div class="calc" id="c-fees">'+money(fees(it))+'</div></label><div style="grid-column:1/-1"><strong>Price helper</strong><div class="f" style="padding:6px 0"><label>Target multiple of cost<input data-ps="mult" type="number" step="0.1" value="'+PS.mult+'"></label><label>eBay fee % (adjust to yours)<input data-ps="eb" type="number" step="0.1" value="'+PS.eb+'"></label><label>Instagram fee % (adjust to yours)<input data-ps="ig" type="number" step="0.1" value="'+PS.ig+'"></label></div><div class="calc" id="sug">'+suggest(it)+'</div></div>':'';
  return '<details open><summary>'+sec.s+'</summary><div class="f">'+sec.f.map(function(f){return field(f,it[f[0]])}).join('')+extra+'</div></details>';
 }).join('')+'<div class="sticky"><button type="submit" class="pri">Save</button><button type="button" data-dup="1">Duplicate</button><button type="button" class="dan" data-del="1">Delete</button><button type="button" data-v="box">Cancel</button></div></form>';
}
function readForm(){
 var o={id:editing.id},fd=new FormData(document.getElementById('form'));
 SCHEMA.forEach(function(s){s.f.forEach(function(f){
  var v=fd.get(f[0]); if(LISTS.indexOf(f[0])>-1)v=v.split(',').map(function(x){return x.trim()}).filter(Boolean);
  else if(f[2]==='number')v=v===''?'':Number(v);
  if(f[0]==='wornCount')v=v===''?'':(v>=0?Math.floor(v):'');
  o[f[0]]=v;
 })});
 return o;
}
var CR=null;
function cropV(){return document.getElementById('cropv')}
function cropPlace(){
 var V=cropV().clientWidth,s=CR.s0*CR.z,w=CR.img.width*s,h=CR.img.height*s;
 CR.x=Math.min(0,Math.max(V-w,CR.x));CR.y=Math.min(0,Math.max(V-h,CR.y));
 var m=document.getElementById('cropimg');m.style.width=w+'px';m.style.height=h+'px';m.style.transform='translate('+CR.x+'px,'+CR.y+'px)';
}
function openCrop(img){
 var box=document.getElementById('crop');box.hidden=false;var V=cropV().clientWidth;
 CR={img:img,s0:V/Math.min(img.width,img.height),z:1,x:0,y:0,p:{}};
 document.getElementById('cropimg').src=img.src;document.getElementById('cropz').value=1;
 CR.x=(V-img.width*CR.s0)/2;CR.y=(V-img.height*CR.s0)/2;cropPlace();box.scrollIntoView({block:'nearest'});
}
function cropZoom(z){
 if(!CR)return;var V=cropV().clientWidth,o=CR.s0*CR.z,cx=(V/2-CR.x)/o,cy=(V/2-CR.y)/o;
 CR.z=z;var n=CR.s0*z;CR.x=V/2-cx*n;CR.y=V/2-cy*n;cropPlace();document.getElementById('cropz').value=z;
}
function cropApply(){
 if(!CR)return;var V=cropV().clientWidth,s=CR.s0*CR.z,c=document.createElement('canvas');c.width=c.height=800;
 c.getContext('2d').drawImage(CR.img,-CR.x/s,-CR.y/s,V/s,V/s,0,0,800,800);
 setCover(c.toDataURL('image/jpeg',.72));document.getElementById('cvurl').value='';document.getElementById('crop').hidden=true;
}
function setCover(v){var m=document.getElementById('cvimg');document.getElementById('cvval').value=v;if(v){m.src=v;m.hidden=false}else{m.removeAttribute('src');m.hidden=true}}
function render(){
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view&&!b.dataset.new)});
 document.getElementById('app').innerHTML=view==='box'?renderBox():view==='cat'?renderCat():renderEdit();
 renderDrawer();
}
function show(v){view=v;ro=false;drawer(false);render();window.scrollTo(0,0)}
function newItem(){return {id:Date.now(),_new:1,category:'ring',status:'Private Collection',tags:[],stones:[],metals:[]}}
var lastJ=null;
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function wt(i){return i.lastWorn?Math.min(365,Math.max(0,Math.round((new Date(today())-new Date(i.lastWorn))/864e5)))+1:365}
function pickJ(pool){var p=pool.length>1?pool.filter(function(i){return i.id!==lastJ}):pool,t=p.reduce(function(s,i){return s+wt(i)},0),r=Math.random()*t;for(var k=0;k<p.length;k++){r-=wt(p[k]);if(r<=0)return p[k]}return p[p.length-1]}
function wear(id){
 var i=items.filter(function(x){return x.id===id})[0];if(!i)return;
 if(i.lastWorn!==today())i.wornCount=(Number(i.wornCount)||0)+1;i.lastWorn=today();save();
 document.getElementById('modal').innerHTML='<div class="modal" data-close="1"><div style="text-align:center"><p style="font-size:3rem;margin:0">✨</p><h3>Today’s jewelry is chosen</h3><p>'+esc(title(i))+'</p><p class="meta">Saved as worn on '+esc(i.lastWorn)+' · '+(Number(i.wornCount)||0)+' time'+(Number(i.wornCount)===1?'':'s')+' worn in total</p><div class="bar" style="justify-content:center"><button class="pri" data-x="1">Done</button></div></div></div>';
}
function jotd(){
 var pool=items.filter(pass);if(!pool.length)pool=items;if(!pool.length)return;
 var i=pickJ(pool);lastJ=i.id;
 document.getElementById('modal').innerHTML='<div class="modal" data-close="1"><div><p class="meta" style="text-align:center">✨ Jewelry of the Day</p>'+(i.cover?'<img class="cvimg" style="max-width:100%;max-height:260px;margin:0 auto 10px" src="'+esc(i.cover)+'" alt="" onerror="this.remove()">':'<div style="font-size:4rem;text-align:center">'+(EMOJI[i.category]||'💎')+'</div>')+'<h3>'+esc(title(i))+'</h3><p class="meta">'+esc([i.category,i.era,i.country,(i.metals||[]).join('/'),(i.stones||[]).join('/')].filter(Boolean).join(' · '))+'</p><p class="meta">'+(i.lastWorn?'Last worn '+esc(i.lastWorn)+(Number(i.wornCount)?' · worn '+Number(i.wornCount)+'×':''):'Not worn yet')+'</p><div class="bar"><button class="pri" data-wear="'+i.id+'">✓ I’m wearing this</button><button data-jotd="1">Shuffle again</button><button data-edit="'+i.id+'">Edit</button><button data-x="1">Close</button></div></div></div>';
}
function popup(i){
 document.getElementById('modal').innerHTML='<div class="modal" data-close="1"><div>'+(i.cover?'<img class="cvimg" style="max-width:100%;max-height:260px;margin:0 auto 10px" src="'+esc(i.cover)+'" alt="" onerror="this.remove()">':'')+'<h3>'+esc(title(i))+'</h3><p>'+esc(i.description)+'</p><p class="meta">'+esc([i.category,i.era,i.country,(i.metals||[]).join('/'),(i.stones||[]).join('/')].filter(Boolean).join(' · '))+'</p><p class="meta">'+(i.mainColor?sw(i.mainColor)+' '+esc(i.mainColor)+' · ':'')+esc((i.tags||[]).join(', '))+'</p><div class="bar"><button class="pri" data-edit="'+i.id+'">Edit</button><button data-x="1">Close</button></div></div></div>';
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-v],[data-tag],[data-clear],[data-pg],[data-edit],[data-open],[data-dup],[data-del],[data-close],[data-x],[data-drawer],[data-dclose],[data-cols],[data-ct],[data-cvrm],[data-ro],[data-jotd],[data-wear],[data-vm],[data-cvadj],[data-cvok],[data-cvcancel],[data-upload]');
 if(!b)return;var d=b.dataset, M=document.getElementById('modal');
 if(d.v){if(d.new)editing=newItem();show(d.v)}
 else if(d.tag){var x=sel.indexOf(d.tag);x>-1?sel.splice(x,1):sel.push(d.tag);render()}
 else if(d.clear){sel=[];render()}
 else if(d.drawer)drawer(true)
 else if(d.dclose)drawer(false)
 else if(d.cols){cols=Number(d.cols);drawer(false);render()}
 else if(d.ct){ctab=d.ct;page=1;drawer(false);render()}
 else if(d.pg){page+=Number(d.pg);render()}
 else if(d.edit){M.innerHTML='';editing=JSON.parse(JSON.stringify(items.filter(function(i){return i.id==d.edit})[0]));show('edit')}
 else if(d.open){if(!ro)popup(items.filter(function(i){return i.id==d.open})[0])}
 else if(d.vm){vmode=d.vm;page=1;ro=false;drawer(false);render()}
 else if(d.upload){drawer(false);alert('Upload is coming soon.')}
 else if(d.jotd){drawer(false);jotd()}
 else if(d.wear)wear(Number(d.wear));
 else if(d.ro){drawer(false);ro=!ro;if(ro){order=sorted(items).map(function(i){return i.id});sortBy='custom';saveOrder()}render()}
 else if(d.x)M.innerHTML=''
 else if(d.close){if(e.target===b)M.innerHTML=''}
 else if(d.cvadj){var cv=document.getElementById('cvval').value;if(cv.indexOf('data:')===0){var im=new Image();im.onload=function(){openCrop(im)};im.src=cv}else alert('Upload a photo first, then you can zoom and pan it.')}
 else if(d.cvok)cropApply()
 else if(d.cvcancel)document.getElementById('crop').hidden=true
 else if(d.cvrm){setCover('');document.getElementById('cvurl').value='';document.getElementById('cvfile').value=''}
 else if(d.dup){var c=readForm();SALE.forEach(function(k){delete c[k]});delete c.lastWorn;delete c.wornCount;c.status='Private Collection';c.id=Date.now();c._new=1;c.description=(c.description||'')+' (copy)';editing=c;render();window.scrollTo(0,0)}
 else if(d.del){if(confirm('Delete this piece?')){items=items.filter(function(i){return i.id!==editing.id});save();show('box')}}
});
document.addEventListener('change',function(e){
 if(e.target.id==='sort'){sortBy=e.target.value;render()}
 if(e.target.id==='cvfile'&&e.target.files[0]){
  var img=new Image(),u=URL.createObjectURL(e.target.files[0]);
  img.onload=function(){openCrop(img)};
  img.src=u;
 }
});
document.addEventListener('input',function(e){
 var f=document.getElementById('form');if(!f||!f.contains(e.target))return;
 if(e.target.id==='cropz'){cropZoom(Number(e.target.value));return}
 if(e.target.id==='cvurl')setCover(e.target.value.trim());
 if(e.target.dataset.ps)PS[e.target.dataset.ps]=Number(e.target.value)||0;
 var o=readForm();document.getElementById('c-days').textContent=days(o)==null?'—':days(o)+' days';document.getElementById('c-net').textContent=money(net(o));document.getElementById('c-fees').textContent=money(fees(o));document.getElementById('sug').innerHTML=suggest(o);
});
document.addEventListener('pointerdown',function(e){
 if(!ro)return;var t=e.target.closest('.ro .tile');if(!t)return;dragEl=t;t.classList.add('drag');
});
document.addEventListener('pointermove',function(e){
 if(!dragEl)return;
 var t=document.elementsFromPoint(e.clientX,e.clientY).filter(function(n){return n.classList&&n.classList.contains('tile')&&n!==dragEl})[0];
 if(overEl&&overEl!==t)overEl.classList.remove('over');
 overEl=t||null;if(overEl)overEl.classList.add('over');
});
function endDrag(){
 if(!dragEl)return;
 var from=Number(dragEl.dataset.open),to=overEl?Number(overEl.dataset.open):null;
 dragEl=null;overEl=null;
 if(to!=null){var fi=order.indexOf(from),ti=order.indexOf(to),o=order.filter(function(x){return x!==from});o.splice(fi<ti?o.indexOf(to)+1:o.indexOf(to),0,from);order=o;saveOrder()}
 render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
function qtoggle(open){var h=document.querySelector('header'),i=document.getElementById('q');h.classList.toggle('sq',open);document.getElementById('qb').textContent=open?'✕':'🔍';if(open)i.focus();else if(q){i.value='';q='';page=1;view==='box'?render():show('box')}}
document.getElementById('qb').addEventListener('click',function(){qtoggle(!document.querySelector('header').classList.contains('sq'))});
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();page=1;view==='box'?render():show('box')});
document.addEventListener('pointerdown',function(e){var v=e.target.closest('#cropv');if(!v||!CR)return;CR.p[e.pointerId]={x:e.clientX,y:e.clientY};v.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',function(e){
 if(!CR||!CR.p[e.pointerId])return;var ids=Object.keys(CR.p),o=CR.p[e.pointerId];
 if(ids.length>1){var other=CR.p[ids.filter(function(k){return k!=e.pointerId})[0]],d0=Math.hypot(o.x-other.x,o.y-other.y),d1=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(d0)cropZoom(Math.min(4,Math.max(1,CR.z*d1/d0)))}
 else{CR.x+=e.clientX-o.x;CR.y+=e.clientY-o.y;cropPlace()}
 CR.p[e.pointerId]={x:e.clientX,y:e.clientY};
});
function cropUp(e){if(CR)delete CR.p[e.pointerId]}
document.addEventListener('pointerup',cropUp);
document.addEventListener('pointercancel',cropUp);
document.addEventListener('wheel',function(e){if(CR&&e.target.closest&&e.target.closest('#cropv')){e.preventDefault();cropZoom(Math.min(4,Math.max(1,CR.z*(1-e.deltaY/500))))}},{passive:false});
document.addEventListener('submit',function(e){
 e.preventDefault();var o=readForm(),idx=items.findIndex(function(i){return i.id===o.id});
 idx>-1?items[idx]=o:items.push(o);save();show('box');
});
render();
</script>
</body>
