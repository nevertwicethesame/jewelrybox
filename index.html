             var url=c.toDataURL(types[t][0],quals[q]);
             if(url.indexOf('data:'+types[t][0])!==0)break;
             var bytes=Math.floor(url.split(',')[1].length*3/4);last=bytes;

function wt(i){return i.wornLast?Math.min(365,Math.max(0,Math.round((new Date(today())-new Date(i.wornLast))/864e5)))+1:365}
function pickJ(pool){var p=pool.length>1?pool.filter(function(i){return i.id!==lastJ}):pool,t=p.reduce(function(s,i){return s+wt(i)},0),r=Math.random()*t;for(var k=0;k<p.length;k++){r-=wt(p[k]);if(r<=0)return p[k]}return p[p.length-1]}
function wearMany(ids){
 var n=0;
 items.forEach(function(i){if(ids.indexOf(i.id)<0)return;if(i.wornLast!==today()){i.wornCount=(Number(i.wornCount)||0)+1;i.wornLast=today();n++}});
 saveItems();return n;
}
var jotdSel=null,jotdMsg='',jotdLock={ring1:false,ring2:false,earring:false,necklace:false};
function jotdPool(cat){return vis().filter(function(i){return i.category===cat&&(i.status==='Waiting'||i.status==='Private Collection')})}
function jotdPickOther(pool,cur){var c=cur?pool.filter(function(i){return i.id!==cur.id}):pool;if(!c.length)c=pool;return c.length?pickJ(c):null}
function jotdRing2Pick(r1){
 if(!r1)return null;var f1=finger(r1);
 var c=jotdPool('Ring').filter(function(i){var f=finger(i);return f&&f!==f1&&i.id!==r1.id});
 return c.length?pickJ(c):null;
}
function jotdRoll(k){
 var s=jotdSel;if(!s||jotdLock[k])return;jotdMsg='';
 if(k==='ring1'){
   var cur=s.ring1,rings=jotdPool('Ring');
   var fs=['Index finger','Middle finger'].filter(function(f){return !(jotdLock.ring2&&s.ring2&&finger(s.ring2)===f)}).sort(function(){return Math.random()-0.5});
   var pick=null;
   for(var n=0;n<fs.length&&!pick;n++){var fn=fs[n];var c=rings.filter(function(i){return finger(i)===fn&&(!cur||i.id!==cur.id)});if(c.length)pick=pickJ(c)}
   if(!pick)pick=cur;
   s.ring1=pick;
   if(!jotdLock.ring2)s.ring2=jotdRing2Pick(pick);
 }
 else if(k==='ring2'){s.ring2=jotdRing2Pick(s.ring1)}
 else if(k==='earring'){s.earring=jotdPickOther(jotdPool('Earrings'),s.earring)}
 else if(k==='necklace'){s.necklace=jotdPickOther(jotdPool('Necklace'),s.necklace)}
}
function jotdLuck(){
 if(!jotdSel)jotdSel={ring1:null,ring2:null,earring:null,necklace:null};
 jotdRoll('ring1');jotdRoll('ring2');jotdRoll('earring');jotdRoll('necklace');jotdMsg='';
}

function hashKW(kw){
 var s='ntts-salt-v1|'+String(kw).trim().toLowerCase();
 if(window.crypto&&crypto.subtle){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')})}
 var h=5381;for(var n=0;n<s.length;n++)h=((h<<5)+h+s.charCodeAt(n))|0;
 return Promise.resolve('djb2-'+(h>>>0).toString(16));
}

/* ---------- CSV / JSON ---------- */
function download(name,mime,text){var b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1000)}
function readFile(f,cb){var r=new FileReader();r.onload=function(){cb(String(r.result))};r.readAsText(f)}
function csvCell(v){v=v==null?'':Array.isArray(v)?v.join('; '):typeof v==='boolean'?(v?'true':'false'):String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
 var head=CSV_COLS.map(function(c){return c[0]==='tags'?'motifs':c[0]}).join(',');
 var body=items.map(function(i){return CSV_COLS.map(function(c){return csvCell(i[c[0]])}).join(',')});
 saveFile('ntts-records-'+stampNow()+'.csv','text/csv',[head].concat(body).join('\r\n'));
}
function parseCSV(t){
 var rows=[],row=[],f='',inq=false;
 for(var i=0;i<t.length;i++){
   var c=t[i];
   if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
   else if(c==='"')inq=true;
   else if(c===','){row.push(f);f=''}
   else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
   else f+=c;
 }
 if(f.length||row.length){row.push(f);rows.push(row)}
 return rows.filter(function(r){return r.some(function(x){return x.trim()!==''})});
}
function coerce(k,v){
 if(LISTS.indexOf(k)>-1)return v.split(/[;,]/).map(function(s){return s.trim()}).filter(Boolean);
 if(['yearMade','wornCount','cost','feeFinal','shipActual','payout','shipEstimate','buffer'].indexOf(k)>-1){var n=Number(String(v).replace(/[$,]/g,''));return isNaN(n)?'':n}
 if(k==='ringSize'){var rz=Number(v);return isNaN(rz)?'':rz}
 if(k==='rating'){var r=Number(v);return isNaN(r)?0:Math.min(5,Math.max(0,Math.floor(r)))}
 if(k==='photoshoot')return /^(yes|true|1|y)$/i.test(v);
 if(['wornLast','purchaseDate','dateListed','dateSold'].indexOf(k)>-1)return parseDate(v)||String(v);
 if(k==='category')return CATS.filter(function(c){return c.toLowerCase()===v.toLowerCase()})[0]||'Other';
 if(k==='status')return STAT.filter(function(s){return s.toLowerCase()===v.toLowerCase()||(v.toUpperCase()==='PC'&&s==='Private Collection')})[0]||'Private Collection';
 if(k==='period')return PERIODS.filter(function(p){return p.toLowerCase()===v.toLowerCase()})[0]||'Antique';
 if(k==='colorMain')return String(v).split(/[,;]/).map(function(x){return capColor(x)}).filter(Boolean);
 return v;
}
function importCSV(text){
 var rows=parseCSV(text);
 if(rows.length<2){alert('No records found in that file.');return}
 var head=rows[0].map(function(h){return h.trim()}),idx={};
 CSV_COLS.forEach(function(c){
   var j=-1;
   head.forEach(function(h,n){
     var hk=ALIAS[h]||h;
     if(j<0&&((hk===c[0]&&c[0]!=='tags')||h.toLowerCase()===c[1]||(c[0]!=='tags'&&h.toLowerCase()===c[0].toLowerCase())))j=n;
   });
   idx[c[0]]=j;
 });
 var added=0,updated=0,skipped=0,nid=Math.max(Date.now(),items.reduce(function(m,i){return Math.max(m,Number(i.id)||0)},0)+1);
 rows.slice(1).forEach(function(r){
   var rec={};
   CSV_COLS.forEach(function(c){var j=idx[c[0]];if(j<0)return;var v=(r[j]||'').trim();if(v!=='')rec[c[0]]=v});
   if(!rec.title){skipped++;return}
   var existing=(rec.id?items.filter(function(i){return String(i.id)===rec.id})[0]:null)||(rec.title?items.filter(function(i){return String(i.title||'').trim().toLowerCase()===rec.title.trim().toLowerCase()&&(i.purchaseDate||'')===(parseDate(rec.purchaseDate||'')||'')})[0]:null)||null;
   var out=existing?JSON.parse(JSON.stringify(existing)):{id:nid++,status:'Waiting',category:'Other',period:'Antique',tags:[],stones:[],metals:[],cut:[],rating:0,refs:[],cover:null};
   Object.keys(rec).forEach(function(k){if(k!=='id')out[k]=coerce(k,rec[k])});
   out=mig(out);
   if(existing){items[items.indexOf(existing)]=out;updated++}else{items.push(out);added++}
 });
 saveItems();render();
 alert('Added '+added+', updated '+updated+(skipped?', skipped '+skipped+' (no title)':'')+'.');
}
function planChunks(){
 var LIMIT=20*1024*1024,chunks=[],cur={items:[],imgs:{}},curSize=0,used={};
 items.forEach(function(i){
   var ids=[];if(i.cover&&i.cover.id)ids.push(i.cover.id);(i.refs||[]).forEach(function(r){ids.push(r)});(i.comps||[]).forEach(function(r){ids.push(r)});
   var add={};ids.forEach(function(id){if(gal.imgs[id]&&!used[id])add[id]=gal.imgs[id]});
   var sz=JSON.stringify(i).length+Object.keys(add).reduce(function(a,k){return a+add[k].length},0);
   if(curSize+sz>LIMIT&&cur.items.length){chunks.push(cur);cur={items:[],imgs:{}};curSize=0}
   cur.items.push(i);Object.keys(add).forEach(function(k){cur.imgs[k]=add[k];used[k]=1});curSize+=sz;
 });
 chunks.push(cur);
 var rest={};Object.keys(gal.imgs).forEach(function(k){if(!used[k])rest[k]=gal.imgs[k]});
 chunks.push({items:[],imgs:rest});
 return chunks;
}

function stampNow(){var d=new Date();return today()+'-'+('0'+d.getHours()).slice(-2)+('0'+d.getMinutes()).slice(-2)}
function saveFile(name,mime,text){
 var mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||navigator.maxTouchPoints>1;
 if(mobile&&navigator.canShare&&typeof File==='function'){
   try{var f=new File([text],name,{type:mime});if(navigator.canShare({files:[f]}))return navigator.share({files:[f],title:name}).then(function(){return true},function(e){if(e&&e.name==='AbortError')return false;download(name,mime,text);return true})}catch(e){}
 }
 download(name,mime,text);return Promise.resolve(true);
}
function exportJSON(){
 var chunks=planChunks(),N=chunks.length,S=stampNow();
 expParts=chunks.map(function(c,n){return {name:'ntts-backup-'+S+'-part'+(n+1)+'of'+N+'.json',chunk:c,n:n,N:N}});
 expDone={};
 renderMain();
 var pe=document.getElementById('expPanel');if(pe&&pe.scrollIntoView)pe.scrollIntoView({behavior:'smooth',block:'center'});
}
